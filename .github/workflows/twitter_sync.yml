name: Twitter Auto Sync

on:
  schedule:
    - cron: '0 0 * * *'  # 每天北京时间早上 8:00 自动运行
  workflow_dispatch:     # 允许你手动点击按钮随时运行

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: 1. 下载仓库代码
      uses: actions/checkout@v4

    - name: 2. 安装 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 3. 安装第三方通用依赖
      run: |
        pip install --upgrade pip
        # 直接安装推特抓取和网络请求所需的通用基础库
        pip install httpx pydantic requests
        # 如果项目里有 requirements.txt，顺便安装一下
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: 4. 运行抓取脚本
      env:
        X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
        X_CT0: ${{ secrets.X_CT0 }}
      run: |
        sed -i "s/TOKEN_PLACEHOLDER/$X_AUTH_TOKEN/g" config/settings.json
        sed -i "s/CT0_PLACEHOLDER/$X_CT0/g" config/settings.json

        # 🌟 指定时间区间抓取：抓取 nasa 在 2026年11月3日 到 2026年11月5日 期间的所有推文
        python search.py --from fangshimin --all -o tweets.json --since 2026-11-03 --until 2026-11-05


    - name: 5. 自动同步数据回仓库
      run: |
        git config --local user.email "actions@github.com"
        git config --local user.name "GitHub Action Bot"
        git add .
        git commit -m "自动更新：抓取最新推文" || exit 0
        git push
