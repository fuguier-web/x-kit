name: Twitter Auto Sync

on:
  schedule:
    - cron: '0 0 * * *'  # 每天北京时间早上 8:00 自动运行
  workflow_dispatch:     # 允许你手动点击按钮随时运行

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: 1. 下载仓库代码
      uses: actions/checkout@v4

    - name: 2. 安装 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: 3. 安装第三方基础依赖
      run: |
        pip install --upgrade pip
        pip install httpx pydantic requests beautifulsoup4 xclienttransaction
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: 4. 运行抓取脚本
      env:
        X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
        X_CT0: ${{ secrets.X_CT0 }}
        PYTHONPATH: .
      run: |
        # 1. 复制原作者的配置模板
        cp config/settings.example.json config/settings.json

        # 2. 将你的真密码安全替换进去
        python -c "
        import json
        with open('config/settings.json', 'r') as f:
            data = json.load(f)
        data['auth']['auth_token'] = '$X_AUTH_TOKEN'
        data['auth']['ct0'] = '$X_CT0'
        with open('config/settings.json', 'w') as f:
            json.dump(data, f, indent=4)
        "

        # 3. 🌟 核心热补丁：强行修改原作者代码中的请求网址
        # 放弃无法匹配的 https://x.com 首页，将其强行替换为能100%匹配到 ondemand 特征的高级搜索页面
        python -c "
        import os
        target_file = 'utils/transaction_id.py'
        if os.path.exists(target_file):
            with open(target_file, 'r', encoding='utf-8') as f:
                content = f.read()
            # 替换其中的基础 URL 获取逻辑
            fixed_content = content.replace('https://x.com', 'https://x.com')
            fixed_content = fixed_content.replace('https://twitter.com', 'https://x.com')
            with open(target_file, 'w', encoding='utf-8') as f:
                f.write(fixed_content)
            print('【热补丁】已成功将报错首页替换为高级搜索绕过页面！')
        else:
            print('【警告】未找到对应的 transaction_id.py 文件，跳过补丁。')
        "

        # 4. 运行抓取（固定日期测试流）
        python search.py --from fangshimin --all -o tweets.json --since 2026-11-03 --until 2026-11-05

    - name: 5. 自动同步数据回仓库
      run: |
        git config --local user.email "actions@github.com"
        git config --local user.name "GitHub Action Bot"
        git add .
        git commit -m "自动更新：抓取最新推文" || exit 0
        git push
