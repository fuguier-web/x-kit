name: Twitter Auto Sync

on:
  schedule:
    - cron: '0 0 * * *'  # 每天北京时间早上 8:00 自动运行
  workflow_dispatch:     # 允许你手动点击按钮随时运行

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: 1. 下载仓库代码
      uses: actions/checkout@v4

    - name: 2. 安装 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 3. 安装第三方通用依赖
      run: |
        pip install --upgrade pip
        # 直接安装推特抓取和网络请求所需的通用基础库
        pip install httpx pydantic requests
        # 如果项目里有 requirements.txt，顺便安装一下
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: 4. 运行抓取脚本
      env:
        X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
        X_CT0: ${{ secrets.X_CT0 }}
      run: |
        # 1. 🌟 直接复制原作者最完整的配置模板，确保绝对不缺任何 api 或配置参数
        cp config/settings.example.json config/settings.json
        
        # 2. 🌟 强制将模板里的占位符或空白行直接替换成你在保险箱里存的真密码
        # 使用 python 脚本来精准修改 json，防止 sed 命令因为特殊字符报错
        python -c "
        import json
        with open('config/settings.json', 'r') as f:
            data = json.load(f)
        data['auth']['auth_token'] = '$X_AUTH_TOKEN'
        data['auth']['ct0'] = '$X_CT0'
        with open('config/settings.json', 'w') as f:
            json.dump(data, f, indent=4)
        "
        
        # 3. 运行抓取
        python search.py --from fangshimin --all -o tweets.json --since 2026-11-03 --until 2026-11-05



    - name: 5. 自动同步数据回仓库
      run: |
        git config --local user.email "actions@github.com"
        git config --local user.name "GitHub Action Bot"
        git add .
        git commit -m "自动更新：抓取最新推文" || exit 0
        git push
