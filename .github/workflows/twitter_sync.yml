name: Twitter Auto Sync

on:
  schedule:
    - cron: '0 0 * * *'  # 每天北京时间早上 8:00 自动运行
  workflow_dispatch:     # 允许你手动点击按钮随时运行

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    permissions:         # 🌟 这一行直接赋予机器人写入权限，彻底解决之前找不到 Workflow permissions 的问题！
      contents: write

    steps:
    - name: 1. 下载仓库代码
      uses: actions/checkout@v4

    - name: 2. 安装 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 3. 安装项目依赖 (x-kit)
      run: |
        pip install --upgrade pip
        # 直接安装原作者的这个库
        pip install git+https://github.com
        # 如果项目目录下有 requirements.txt 则额外安装，没有就跳过
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: 4. 运行抓取脚本
      env:
        X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
        X_CT0: ${{ secrets.X_CT0 }}
      run: |
        # 优先运行你留在仓库根目录下的自定义脚本，如果不存在则运行 main.py
        if [ -f run_scraper.py ]; then
          python run_scraper.py
        elif [ -f main.py ]; then
          python main.py
        else
          echo "未找到运行脚本，尝试执行模块测试..."
          python -c "import x_kit; print('x-kit 安装成功')"
        fi

    - name: 5. 自动同步数据回仓库
      run: |
        git config --local user.email "actions@github.com"
        git config --local user.name "GitHub Action Bot"
        git add .
        git commit -m "自动更新：抓取最新推文" || exit 0
        git push
