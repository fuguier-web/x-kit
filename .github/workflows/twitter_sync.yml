name: Twitter Auto Sync

on:
  schedule:
    - cron: '0 0 * * *'  # 每天北京时间早上 8:00 自动运行
  workflow_dispatch:     # 允许你手动点击按钮随时运行

jobs:
  run-scraper:
    runs-on: ubuntu-latest  # 🌟 已修正为完全正确的 runs-on
    permissions:
      contents: write

    steps:
    - name: 1. 下载仓库代码
      uses: actions/checkout@v4

    - name: 2. 安装 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'  # 🌟 核心修复：升级到 3.12 以完美兼容作者内置的二进制解密包


    - name: 3. 安装第三方通用依赖
      run: |
        pip install --upgrade pip
        # 🌟 修复：使用官方市场上登记的正确名字 xclienttransaction 进行精准下载
        pip install httpx pydantic requests beautifulsoup4 xclienttransaction
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi


    - name: 4. 运行抓取脚本
      env:
        X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
        X_CT0: ${{ secrets.X_CT0 }}
        # 让 Python 自动扫描本地所有文件夹，彻底解决找不到本地加密包的问题
        PYTHONPATH: .
      run: |
        # 1. 复制原作者最完整的配置模板
        cp config/settings.example.json config/settings.json

        # 2. 将你的真密码安全替换进去
        python -c "
        import json
        with open('config/settings.json', 'r') as f:
            data = json.load(f)
        data['auth']['auth_token'] = '$X_AUTH_TOKEN'
        data['auth']['ct0'] = '$X_CT0'
        with open('config/settings.json', 'w') as f:
            json.dump(data, f, indent=4)
        "

        # 3. 运行抓取（固定日期测试流）
        python search.py --from fangshimin --all -o tweets.json --since 2026-11-03 --until 2026-11-05

    - name: 5. 自动同步数据回仓库
      run: |
        git config --local user.email "actions@github.com"
        git config --local user.name "GitHub Action Bot"
        git add .
        git commit -m "自动更新：抓取最新推文" || exit 0
        git push
