name: Twitter Auto Sync

on:
  schedule:
    - cron: '0 0 * * *'  # 每天北京时间早上 8:00 自动运行
  workflow_dispatch:     # 允许你手动点击按钮随时运行

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: 1. 下载仓库代码
      uses: actions/checkout@v4

    - name: 2. 安装 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 3. 安装第三方通用依赖
      run: |
        pip install --upgrade pip
        # 直接安装推特抓取和网络请求所需的通用基础库
        pip install httpx pydantic requests
        # 如果项目里有 requirements.txt，顺便安装一下
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: 4. 运行抓取脚本
      env:
        X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
        X_CT0: ${{ secrets.X_CT0 }}
      run: |
        # 绕过打包，直接用 python 启动原作者的脚本。
        # 我们来看看原作者提供了哪个主入口，按顺序尝试运行：
        if [ -f main.py ]; then
          python main.py
        elif [ -f run.py ]; then
          python run.py
        elif [ -f run_scraper.py ]; then
          python run_scraper.py
        else
          echo "未找到任何标准启动脚本，尝试列出当前目录文件："
          ls -R
          exit 1
        fi

    - name: 5. 自动同步数据回仓库
      run: |
        git config --local user.email "actions@github.com"
        git config --local user.name "GitHub Action Bot"
        git add .
        git commit -m "自动更新：抓取最新推文" || exit 0
        git push
